[package]
name = "zombs"
version = "0.1.0"
description = "$ZOMBS Wrap/Unwrap Solana Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zombs"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["metadata"] }
spl-token = { version = "4", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2", features = ["no-entrypoint"] }
mpl-token-metadata = { version = "3", features = ["no-entrypoint"] }
